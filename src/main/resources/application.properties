spring.application.name=belajar-springboot

# Server Port
server.port=8080

# ===================================================================
# OPTION 1: POSTGRESQL DATABASE CONFIGURATION (Active Real DB)
# ===================================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/bankdb
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ===================================================================
# OPTION 2: H2 IN-MEMORY DATABASE (Commented out)
# ===================================================================
# spring.h2.console.enabled=true
# spring.h2.console.path=/h2-console
# spring.datasource.url=jdbc:h2:mem:belajardb
# spring.datasource.driverClassName=org.h2.Driver
# spring.datasource.username=sa
# spring.datasource.password=
# spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# ===================================================================
# JPA & HIBERNATE COMMON SETTINGS
# ===================================================================
# 'update' -> Otomatis buat/sesuaikan tabel 'nasabah' di database PostgreSQL bankdb
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===================================================================
# LOGGING CONFIGURATION
# ===================================================================
logging.level.root=INFO
logging.level.com.belajar.springboot=DEBUG
logging.file.name=logs/banking-application.log
