<div class="cbs-screen">
    <div class="cbs-topbar">
        <span class="cbs-topbar-title">[GL03] JURNAL UMUM</span>
        <span class="cbs-topbar-right">TxCode: <span class="cbs-txcd">GL03</span></span>
    </div>

    <div id="gl03Msg" class="cbs-msg"></div>

    <form onsubmit="cbSubmitGL03(event)">
        <div class="cbs-panel">
            <div class="cbs-panel-title">POSTING JURNAL (DEBET = KREDIT)</div>
            <div class="cbs-grid-form">
                <div class="cbs-field">
                    <label class="cbs-label req" for="gl03Debit">Akun Debet</label>
                    <select id="gl03Debit" required>
                        <option value="">MEMUAT...</option>
                    </select>
                </div>
                <div class="cbs-field">
                    <label class="cbs-label req" for="gl03Kredit">Akun Kredit</label>
                    <select id="gl03Kredit" required>
                        <option value="">MEMUAT...</option>
                    </select>
                </div>
                <div class="cbs-field">
                    <label class="cbs-label req" for="gl03Nominal">Nominal (Rp)</label>
                    <input type="number" id="gl03Nominal" min="1" step="0.01" required>
                </div>
                <div class="cbs-field">
                    <label class="cbs-label" for="gl03Keterangan">Keterangan</label>
                    <input type="text" id="gl03Keterangan" maxlength="200">
                </div>
            </div>
        </div>

        <div class="cbs-btns">
            <button type="submit" id="gl03Submit" class="cbs-btn cbs-btn-ok">Posting Jurnal</button>
            <button type="reset" class="cbs-btn">Bersihkan</button>
        </div>
    </form>

    <div class="cbs-note">
        Akun berawalan 4.x adalah pendapatan (kredit), 5.x adalah beban (debet).
        Contoh: membukukan biaya administrasi yang dipotong dari tabungan nasabah: Debet REKENING TABUNGAN, Kredit PENDAPATAN ADMINISTRASI.
    </div>
</div>
