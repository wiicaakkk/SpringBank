<div class="cbs-screen">
    <div class="cbs-topbar">
        <span class="cbs-topbar-title">[DP04] TARIK TUNAI</span>
        <span class="cbs-topbar-right">TxCode: <span class="cbs-txcd">DP04</span></span>
    </div>

    <div id="dp04Msg" class="cbs-msg"></div>

    <form onsubmit="cbSubmitDP04(event)">
        <div class="cbs-panel">
            <div class="cbs-panel-title">INPUT PENARIKAN</div>
            <div class="cbs-grid-form">
                <div class="cbs-field">
                    <label class="cbs-label req" for="dp04Norek">Nomor Rekening</label>
                    <input type="text" id="dp04Norek" maxlength="20" required>
                </div>
                <div class="cbs-field">
                    <label class="cbs-label req" for="dp04Nominal">Nominal Penarikan (Rp), min 10.000</label>
                    <input type="number" id="dp04Nominal" min="10000" step="0.01" required>
                </div>
            </div>
        </div>

        <div class="cbs-btns">
            <button type="submit" id="dp04Submit" class="cbs-btn cbs-btn-ok">Proses Penarikan</button>
            <button type="reset" class="cbs-btn">Bersihkan</button>
        </div>
    </form>

    <div class="cbs-note">
        Tarik tunai mengurangi saldo rekening dan tercatat sebagai transaksi DEBIT. Saldo harus mencukupi.
    </div>
</div>
