<div id="moduleDP02" class="card">
    <div class="menu-banner">
        <span>MODUL AKTIF: <strong>[DP02] TRANSAKSI OVER-THE-COUNTER & TRANSFER ANTAREKENING</strong></span>
        <button onclick="executeMenuCommand('CLEAR')" style="background:none; border:none; color:var(--accent-blue); cursor:pointer;">[ Tutup Modul ]</button>
    </div>

    <form id="transferForm" onsubmit="submitTransfer(event)">
        <div class="form-row">
            <div class="form-group">
                <label>Nomor Rekening Asal (Debit) *</label>
                <input type="text" id="dp02RekAsal" required placeholder="e.g. 3436196555">
            </div>
            <div class="form-group">
                <label>Nomor Rekening Tujuan (Kredit) *</label>
                <input type="text" id="dp02RekTujuan" required placeholder="e.g. 8081350139">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>Nominal Transfer (Rp) * [Minimal Rp 10.000]</label>
                <input type="number" id="dp02Nominal" required placeholder="1500000" min="10000">
            </div>
            <div class="form-group">
                <label>Berita / Keterangan Transaksi</label>
                <input type="text" id="dp02Berita" placeholder="Transfer Honor Pekerjaan">
            </div>
        </div>

        <button type="submit" class="btn btn-gold" style="width: 100%; margin-top: 0.5rem; justify-content: center; padding: 0.8rem; font-size: 1rem;">
            Eksekusi Transaksi Transfer (@Transactional Engine)
        </button>
    </form>
</div>
