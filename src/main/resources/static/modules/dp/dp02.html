<div class="cbs-screen">
    <div class="cbs-topbar">
        <span class="cbs-topbar-title">[DP02] TRANSFER ANTAR REKENING (OVER THE COUNTER)</span>
        <span class="cbs-topbar-right">TxCode: <span class="cbs-txcd">DP02</span></span>
    </div>

    <div id="dp02Msg" class="cbs-msg"></div>

    <form onsubmit="cbSubmitDP02(event)">
        <div class="cbs-panel">
            <div class="cbs-panel-title">DATA TRANSFER</div>
            <div class="cbs-grid-form">
                <div class="cbs-field">
                    <label class="cbs-label req" for="dp02Asal">Rekening Asal (Debit)</label>
                    <input type="text" id="dp02Asal" maxlength="20" required>
                </div>
                <div class="cbs-field">
                    <label class="cbs-label req" for="dp02Tujuan">Rekening Tujuan (Kredit)</label>
                    <input type="text" id="dp02Tujuan" maxlength="20" required>
                </div>
                <div class="cbs-field">
                    <label class="cbs-label req" for="dp02Nominal">Nominal Transfer (Rp), min 10.000</label>
                    <input type="number" id="dp02Nominal" min="10000" step="0.01" required>
                </div>
                <div class="cbs-field">
                    <label class="cbs-label" for="dp02Berita">Berita / Keterangan</label>
                    <input type="text" id="dp02Berita" maxlength="255">
                </div>
            </div>
        </div>

        <div class="cbs-btns">
            <button type="submit" id="dp02Submit" class="cbs-btn cbs-btn-ok">Eksekusi Transfer</button>
            <button type="reset" class="cbs-btn">Bersihkan</button>
        </div>
    </form>

    <div class="cbs-note">
        Transfer diproses dalam satu transaksi database (debit dan kredit dicatat bersamaan).
    </div>
</div>
