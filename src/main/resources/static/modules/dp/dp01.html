<div class="cbs-screen">
    <div class="cbs-topbar">
        <span class="cbs-topbar-title">[DP01] PEMBUKAAN REKENING TABUNGAN BARU</span>
        <span class="cbs-topbar-right">TxCode: <span class="cbs-txcd">DP01</span></span>
    </div>

    <div id="dp01Msg" class="cbs-msg"></div>

    <form onsubmit="cbSubmitDP01(event)">
        <div class="cbs-panel">
            <div class="cbs-panel-title">DATA PEMBUKAAN REKENING</div>
            <div class="cbs-grid-form">
                <div class="cbs-field">
                    <label class="cbs-label req" for="dp01Cif">Nomor CIF Nasabah</label>
                    <input type="text" id="dp01Cif" maxlength="20" required>
                </div>
                <div class="cbs-field">
                    <label class="cbs-label req" for="dp01Jenis">Jenis Produk Tabungan</label>
                    <select id="dp01Jenis" required>
                        <option value="TABUNGAN_UTAMA">TABUNGAN UTAMA</option>
                        <option value="TABUNGAN_BISNIS">TABUNGAN BISNIS PREMIER</option>
                        <option value="DEPOSITO">DEPOSITO BERJANGKA</option>
                    </select>
                </div>
                <div class="cbs-field">
                    <label class="cbs-label req" for="dp01Setoran">Setoran Awal (Rp), min 50.000</label>
                    <input type="number" id="dp01Setoran" min="50000" step="0.01" required>
                </div>
            </div>
        </div>

        <div class="cbs-btns">
            <button type="button" class="cbs-btn" onclick="cbLookupOpen('dp01Cif')">Cari CIF</button>
            <button type="submit" id="dp01Submit" class="cbs-btn cbs-btn-ok">Buka Rekening</button>
            <button type="reset" class="cbs-btn">Bersihkan</button>
        </div>
    </form>

    <div class="cbs-note">
        Nomor rekening 10 digit diterbitkan otomatis oleh sistem dan langsung tercatat sebagai transaksi perdana.
    </div>
</div>
