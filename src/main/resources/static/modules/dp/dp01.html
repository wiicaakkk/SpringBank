<div id="moduleDP01" class="card">
    <div class="menu-banner">
        <span>MODUL AKTIF: <strong>[DP01] PEMBUKAAN REKENING TABUNGAN BARU</strong></span>
        <button onclick="executeMenuCommand('CLEAR')" style="background:none; border:none; color:var(--accent-blue); cursor:pointer;">[ Tutup Modul ]</button>
    </div>

    <form id="createRekeningForm" onsubmit="submitCreateRekening(event)">
        <div class="form-row">
            <div class="form-group">
                <label>Nomor CIF Nasabah *</label>
                <div class="input-lookup-group">
                    <input type="text" id="dp01Cif" required placeholder="e.g. CIF202607260001">
                    <button type="button" onclick="openCifLookup('dp01Cif')" class="btn" title="Cari CIF berdasarkan Nama / NIK">
                        [ Cari CIF ]
                    </button>
                </div>
            </div>
            <div class="form-group">
                <label>Jenis Produk Tabungan *</label>
                <select id="dp01JenisTabungan" required>
                    <option value="TABUNGAN_UTAMA">Tabungan Utama Bank</option>
                    <option value="TABUNGAN_BISNIS">Tabungan Bisnis Premier</option>
                    <option value="DEPOSITO">Deposito Berjangka</option>
                </select>
            </div>
        </div>

        <div class="form-group full" style="margin-bottom: 1.2rem;">
            <label>Setoran Awal (Rp) * [Minimal Rp 50.000]</label>
            <input type="number" id="dp01SetoranAwal" required placeholder="5000000" min="50000">
        </div>

        <button type="submit" class="btn btn-gold" style="width: 100%; justify-content: center; padding: 0.8rem; font-size: 1rem;">
            Buka Rekening & Generasikan No. Rekening 10 Digit
        </button>
    </form>
</div>
