<div id="moduleRC11" class="card">
    <div class="menu-banner">
        <span>MODUL AKTIF: <strong>[RC11] PENDAFTARAN NASABAH BARU & GENERATOR CIF</strong></span>
        <button onclick="executeMenuCommand('CLEAR')" style="background:none; border:none; color:var(--accent-blue); cursor:pointer;">[ Tutup Modul ]</button>
    </div>
    
    <form id="registerForm" onsubmit="submitRegistration(event)">
        <div class="form-row">
            <div class="form-group">
                <label>NIK (16 Digit KTP) *</label>
                <input type="text" id="nik" maxlength="16" required placeholder="3171012005900004">
            </div>
            <div class="form-group">
                <label>Nama Lengkap *</label>
                <input type="text" id="namaLengkap" required placeholder="Rina Melati">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>Tempat Lahir *</label>
                <input type="text" id="tempatLahir" required placeholder="Jakarta">
            </div>
            <div class="form-group">
                <label>Tanggal Lahir *</label>
                <input type="date" id="tanggalLahir" required>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>Jenis Kelamin *</label>
                <select id="jenisKelamin" required>
                    <option value="LAKI_LAKI">Laki-Laki</option>
                    <option value="PEREMPUAN">Perempuan</option>
                </select>
            </div>
            <div class="form-group">
                <label>Nama Ibu Kandung *</label>
                <input type="text" id="ibuKandung" required placeholder="Siti Rahma">
            </div>
        </div>

        <div class="form-group full" style="margin-bottom: 1rem;">
            <label>Alamat Lengkap *</label>
            <input type="text" id="alamat" required placeholder="Jl. Gatot Subroto No. 88, Jakarta">
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>Nomor HP *</label>
                <input type="text" id="nomorHp" required placeholder="081299887766">
            </div>
            <div class="form-group">
                <label>Email *</label>
                <input type="email" id="email" required placeholder="rina@example.com">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>Pekerjaan *</label>
                <input type="text" id="pekerjaan" required placeholder="Manager Operations">
            </div>
            <div class="form-group">
                <label>Penghasilan Bulanan (Rp) *</label>
                <input type="number" id="penghasilanBulanan" required placeholder="15000000">
            </div>
        </div>

        <button type="submit" class="btn btn-gold" style="width: 100%; margin-top: 0.5rem; justify-content: center; padding: 0.8rem; font-size: 1rem;">
            Proses CIF & Daftar Nasabah Baru
        </button>
    </form>
</div>
