<div class="cbs-screen">
    <div class="cbs-topbar">
        <span class="cbs-topbar-title">[RC11] REGISTRASI NASABAH BARU &amp; GENERATOR CIF</span>
        <span class="cbs-topbar-right">TxCode: <span class="cbs-txcd">RC11</span></span>
    </div>

    <div id="rc11Msg" class="cbs-msg"></div>

    <form onsubmit="cbSubmitRC11(event)">
        <div class="cbs-panel">
            <div class="cbs-panel-title">DATA PRIBADI NASABAH</div>
            <div class="cbs-grid-form">
                <div class="cbs-field">
                    <label class="cbs-label req" for="rc11Nik">NIK (16 digit KTP)</label>
                    <input type="text" id="rc11Nik" maxlength="16" inputmode="numeric" required>
                </div>
                <div class="cbs-field">
                    <label class="cbs-label req" for="rc11Nama">Nama Lengkap</label>
                    <input type="text" id="rc11Nama" required>
                </div>
                <div class="cbs-field">
                    <label class="cbs-label req" for="rc11Tempat">Tempat Lahir</label>
                    <input type="text" id="rc11Tempat" required>
                </div>
                <div class="cbs-field">
                    <label class="cbs-label req" for="rc11Tgl">Tanggal Lahir</label>
                    <input type="date" id="rc11Tgl" required>
                </div>
                <div class="cbs-field">
                    <label class="cbs-label req" for="rc11Kelamin">Jenis Kelamin</label>
                    <select id="rc11Kelamin" required>
                        <option value="LAKI_LAKI">LAKI-LAKI</option>
                        <option value="PEREMPUAN">PEREMPUAN</option>
                    </select>
                </div>
                <div class="cbs-field">
                    <label class="cbs-label req" for="rc11Ibu">Nama Ibu Kandung</label>
                    <input type="text" id="rc11Ibu" required>
                </div>
                <div class="cbs-field">
                    <label class="cbs-label req" for="rc11Alamat">Alamat Domisili</label>
                    <input type="text" id="rc11Alamat" required>
                </div>
                <div class="cbs-field">
                    <label class="cbs-label req" for="rc11Hp">Nomor HP</label>
                    <input type="text" id="rc11Hp" inputmode="tel" required>
                </div>
                <div class="cbs-field">
                    <label class="cbs-label req" for="rc11Email">Email</label>
                    <input type="email" id="rc11Email" required>
                </div>
                <div class="cbs-field">
                    <label class="cbs-label req" for="rc11Pekerjaan">Pekerjaan</label>
                    <input type="text" id="rc11Pekerjaan" required>
                </div>
                <div class="cbs-field">
                    <label class="cbs-label req" for="rc11Penghasilan">Penghasilan Bulanan (Rp)</label>
                    <input type="number" id="rc11Penghasilan" min="0" step="0.01" required>
                </div>
            </div>
        </div>

        <div class="cbs-btns">
            <button type="submit" id="rc11Submit" class="cbs-btn cbs-btn-ok">Proses CIF</button>
            <button type="reset" class="cbs-btn">Bersihkan</button>
        </div>
    </form>

    <div class="cbs-note">
        Nomor CIF diterbitkan otomatis oleh sistem dengan format CIF + TANGGAL + SEKUENSIAL 4 DIGIT.
    </div>
</div>
