<div class="cbs-screen">
    <div class="cbs-topbar">
        <span class="cbs-topbar-title">[RC14] PEMELIHARAAN DATA PROFIL NASABAH (CIF)</span>
        <span class="cbs-topbar-right">TxCode: <span class="cbs-txcd">RC14</span></span>
    </div>

    <div id="rc14Msg" class="cbs-msg"></div>

    <div class="cbs-panel">
        <div class="cbs-panel-title">IDENTIFIKASI CIF</div>
        <div class="cbs-grid-form">
            <div class="cbs-field">
                <label class="cbs-label req" for="rc14Cif">Nomor CIF</label>
                <input type="text" id="rc14Cif" maxlength="20">
            </div>
        </div>
        <div class="cbs-btns" style="margin:8px 0 0; justify-content:flex-end">
            <button type="button" class="cbs-btn" onclick="cbLookupOpen('rc14Cif')">Cari CIF</button>
            <button type="button" class="cbs-btn cbs-btn-ok" onclick="cbRC14LoadCif()">Load Data CIF</button>
        </div>
    </div>

    <form id="rc14Form" onsubmit="cbSubmitRC14(event)" style="display:none">
        <div class="cbs-panel">
            <div class="cbs-panel-title">PROFIL NASABAH</div>
            <div class="cbs-grid-form">
                <div class="cbs-field">
                    <label class="cbs-label" for="rc14CifRo">Nomor CIF</label>
                    <input type="text" id="rc14CifRo" class="cbs-input-ro" readonly>
                </div>
                <div class="cbs-field">
                    <label class="cbs-label" for="rc14NikRo">NIK</label>
                    <input type="text" id="rc14NikRo" class="cbs-input-ro" readonly>
                </div>
                <div class="cbs-field">
                    <label class="cbs-label req" for="rc14Nama">Nama Lengkap</label>
                    <input type="text" id="rc14Nama" required>
                </div>
                <div class="cbs-field">
                    <label class="cbs-label req" for="rc14Alamat">Alamat Domisili</label>
                    <input type="text" id="rc14Alamat" required>
                </div>
                <div class="cbs-field">
                    <label class="cbs-label req" for="rc14Hp">Nomor HP</label>
                    <input type="text" id="rc14Hp" inputmode="tel" required>
                </div>
                <div class="cbs-field">
                    <label class="cbs-label req" for="rc14Email">Email</label>
                    <input type="email" id="rc14Email" required>
                </div>
                <div class="cbs-field">
                    <label class="cbs-label req" for="rc14Pekerjaan">Pekerjaan</label>
                    <input type="text" id="rc14Pekerjaan" required>
                </div>
                <div class="cbs-field">
                    <label class="cbs-label req" for="rc14Penghasilan">Penghasilan Bulanan (Rp)</label>
                    <input type="number" id="rc14Penghasilan" min="0" step="0.01" required>
                </div>
            </div>
        </div>

        <div class="cbs-btns">
            <button type="submit" id="rc14Submit" class="cbs-btn cbs-btn-ok">Simpan Perubahan</button>
            <button type="reset" class="cbs-btn">Bersihkan Form</button>
        </div>
    </form>

    <div class="cbs-note">
        Setiap penyimpanan perubahan profil akan tercatat pada audit trail (RC13).
    </div>
</div>
