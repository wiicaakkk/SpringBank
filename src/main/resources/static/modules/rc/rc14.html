<div id="moduleRC14" class="card">
    <div class="menu-banner">
        <span>MODUL AKTIF: <strong>[RC14] PEMELIHARAAN DATA PROFIL NASABAH (CIF MAINTENANCE)</strong></span>
        <button onclick="executeMenuCommand('CLEAR')" style="background:none; border:none; color:var(--accent-blue); cursor:pointer;">[ Tutup Modul ]</button>
    </div>

    <div style="margin-bottom: 1rem;" class="input-lookup-group">
        <input type="text" id="rc14SearchCif" placeholder="Masukkan Nomor CIF (e.g. CIF202607260001)...">
        <button onclick="openCifLookup('rc14SearchCif')" class="btn" title="Cari CIF berdasarkan Nama / NIK">
            [ Cari CIF ]
        </button>
        <button onclick="loadCifForUpdate()" class="btn btn-gold">Load Data CIF</button>
    </div>

    <form id="updateForm" onsubmit="submitUpdateProfile(event)" style="display: none;">
        <div class="form-row">
            <div class="form-group">
                <label>Nomor CIF (Readonly)</label>
                <input type="text" id="updateCif" readonly style="opacity: 0.7; font-family: 'JetBrains Mono';">
            </div>
            <div class="form-group">
                <label>Nama Lengkap *</label>
                <input type="text" id="updateNamaLengkap" required>
            </div>
        </div>

        <div class="form-group full" style="margin-bottom: 1rem;">
            <label>Alamat Lengkap *</label>
            <input type="text" id="updateAlamat" required>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>Nomor HP *</label>
                <input type="text" id="updateNomorHp" required>
            </div>
            <div class="form-group">
                <label>Email *</label>
                <input type="email" id="updateEmail" required>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>Pekerjaan *</label>
                <input type="text" id="updatePekerjaan" required>
            </div>
            <div class="form-group">
                <label>Penghasilan Bulanan (Rp) *</label>
                <input type="number" id="updatePenghasilanBulanan" required>
            </div>
        </div>

        <button type="submit" class="btn btn-gold" style="width: 100%; margin-top: 0.5rem; justify-content: center; padding: 0.8rem; font-size: 1rem;">
            Simpan Perubahan Profile CIF & Catat Audit Log
        </button>
    </form>
</div>
