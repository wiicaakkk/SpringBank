<div class="cbs-screen">
    <div class="cbs-topbar">
        <span class="cbs-topbar-title">[RC12] INQUIRY &amp; DATABASE CIF NASABAH</span>
        <span class="cbs-topbar-right">TxCode: <span class="cbs-txcd">RC12</span></span>
    </div>

    <div class="cbs-panel">
        <div class="cbs-panel-title">KRITERIA PENCARIAN</div>
        <div class="cbs-grid-form">
            <div class="cbs-field">
                <label class="cbs-label" for="rc12Keyword">Kata kunci (CIF / NIK / Nama)</label>
                <input type="text" id="rc12Keyword" onkeyup="if(event.key==='Enter')cbRC12Search()">
            </div>
        </div>
        <div class="cbs-btns" style="margin:8px 0 0; justify-content:flex-end">
            <button type="button" class="cbs-btn cbs-btn-ok" onclick="cbRC12Search()">Cari</button>
            <button type="button" class="cbs-btn" onclick="cbRC12Load()">Reset</button>
        </div>
    </div>

    <div class="cbs-grid-wrap">
        <table class="cbs-grid">
            <thead>
                <tr>
                    <th>No. CIF</th>
                    <th>NIK</th>
                    <th>Nama Lengkap</th>
                    <th>Tempat / Tgl Lahir</th>
                    <th>Pekerjaan</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="rc12Body">
                <tr><td colspan="6" class="cbs-empty">MEMUAT DATA...</td></tr>
            </tbody>
        </table>
    </div>
</div>
